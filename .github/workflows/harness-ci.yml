name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-harness:
    name: Validate Harness, Schemas & Policies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Validate Skills
        run: pnpm tsx scripts/validate-skills.ts

      - name: Run Full Test Suite
        run: pnpm test

      - name: Validate Example Lanes Manifest
        run: |
          pnpm tsx harness/matrix/generator.ts config/lanes.example.yaml 5

      - name: Install Security Tools
        run: |
          # 1. Install actionlint
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash 1.7.7)
          sudo mv ./actionlint /usr/local/bin/
          # 2. Install zizmor & semgrep in isolated environment
          python3 -m venv /opt/sec-tools
          /opt/sec-tools/bin/pip install --upgrade pip
          /opt/sec-tools/bin/pip install "setuptools<82" zizmor==1.4.1 semgrep==1.99.0
          echo "/opt/sec-tools/bin" >> "$GITHUB_PATH"

      - name: Run actionlint on Workflows
        run: actionlint .github/workflows/*.yml

      - name: Run zizmor on Workflows
        run: zizmor .github/workflows/*.yml

      - name: Run shellcheck on Shell Scripts
        run: |
          # Run shellcheck on all repository shell scripts if present
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.git/*" -exec shellcheck {} +

      - name: Run Semgrep Security Scan
        run: semgrep scan --config config/semgrep.yaml --error .
