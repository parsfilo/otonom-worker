name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-harness:
    name: Validate Harness, Schemas & Policies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Harness
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Validate Skills
        run: pnpm tsx scripts/validate-skills.ts

      - name: Run Full Test Suite
        run: pnpm test

      - name: Validate Example Lanes Manifest
        run: |
          pnpm tsx harness/matrix/generator.ts config/lanes.example.yaml 5
