name: OTONOM Swarm Runner

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path to wave/tasks manifest file (YAML or JSON)"
        required: true
        default: "config/lanes.example.yaml"
      source_ref:
        description: "Target repository Git commit SHA or ref"
        required: true
        default: "main"
      max_parallel:
        description: "Maximum concurrent agent jobs (1 to 20)"
        required: true
        default: "5"
      lane_filter:
        description: "Optional single lane ID to filter execution"
        required: false
        default: ""
      dry_run:
        description: "Dry-run mode: do not push branches or open PRs"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-and-generate-matrix:
    name: Generate Execution Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      max_parallel: ${{ steps.generate.outputs.max_parallel }}
    steps:
      - name: Checkout Harness Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Harness Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Skills and Configuration
        run: |
          pnpm tsx scripts/validate-skills.ts
          pnpm typecheck

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Doppler Preflight
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SWARM_FORCE_SINGLE: ${{ github.event.inputs.manifest_path == 'config/lanes.phase2-smoke.yaml' && 'true' || 'false' }}
        run: |
          pnpm tsx harness/doppler/preflight.ts

      - name: Generate Matrix
        id: generate
        env:
          MAX_PARALLEL: ${{ github.event.inputs.max_parallel }}
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          LANE_FILTER: ${{ github.event.inputs.lane_filter }}
        run: |
          if [ "$MAX_PARALLEL" -gt 20 ]; then
            echo "ERROR: max_parallel cannot exceed 20 (requested $MAX_PARALLEL)" >&2
            exit 1
          fi

          MATRIX_JSON=$(pnpm tsx harness/matrix/generator.ts "$MANIFEST_PATH" "$MAX_PARALLEL" "$LANE_FILTER")
          {
            echo "matrix=$MATRIX_JSON"
            echo "max_parallel=$MAX_PARALLEL"
          } >> "$GITHUB_OUTPUT"

  run-agent:
    name: "Lane: ${{ matrix.lane }}"
    needs: validate-and-generate-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes || 35 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.validate-and-generate-matrix.outputs.max_parallel) }}
      matrix: ${{ fromJson(needs.validate-and-generate-matrix.outputs.matrix) }}
    env:
      LANE_ID: ${{ matrix.lane }}
      BASE_SHA: ${{ matrix.base_sha }}
      ROLE: ${{ matrix.role }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      CI: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_PAGER: "cat"
      PAGER: "cat"
      NO_COLOR: "1"
    steps:
      - name: Checkout Worker Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Toolchain
        run: |
          pnpm install --frozen-lockfile
          # Pinned OpenCode installation from toolchain.lock.json
          npm install -g opencode-ai@1.18.32
          # Pinned Language Servers & CLI Tools
          npm install -g typescript-language-server@4.3.3 yaml-language-server@1.15.0 bash-language-server@5.4.3 vscode-langservers-extracted@4.10.0 @ast-grep/cli@0.45.3
          # Pinned uv / uvx for Serena runtime
          python3 -m venv /opt/uv-tools
          /opt/uv-tools/bin/pip install --upgrade pip
          /opt/uv-tools/bin/pip install "uv==0.12.19"
          echo "/opt/uv-tools/bin" >> "$GITHUB_PATH"

      - name: Verify uv Toolchain
        run: |
          uv --version
          uvx --version

      - name: Probe Anonymous OpenCode Free Tier
        if: ${{ github.event.inputs.manifest_path == 'config/lanes.phase2-smoke.yaml' }}
        shell: bash
        run: |
          PROBE_HOME="$RUNNER_TEMP/opencode-anon-probe"
          PROBE_OUT="$RUNNER_TEMP/opencode-anon-probe.out"
          PROBE_ERR="$RUNNER_TEMP/opencode-anon-probe.err"
          rm -rf "$PROBE_HOME" "$PROBE_OUT" "$PROBE_ERR"
          mkdir -p "$PROBE_HOME"

          set +e
          timeout 50s env             HOME="$PROBE_HOME"             XDG_CONFIG_HOME="$PROBE_HOME/.config"             XDG_DATA_HOME="$PROBE_HOME/.local/share"             opencode run -m opencode/mimo-v2.6-flash-free --auto "Reply exactly OK"             >"$PROBE_OUT" 2>"$PROBE_ERR"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "anonymous_free_tier_probe=PASS"
          elif [ "$rc" -eq 124 ]; then
            echo "anonymous_free_tier_probe=TIMEOUT"
          elif grep -Eiq 'free tier can only be used from within opencode' "$PROBE_ERR" "$PROBE_OUT"; then
            echo "anonymous_free_tier_probe=FREE_TIER_CLIENT_GATE"
          elif grep -Eiq 'unauthorized|authentication required|api.?key|credential' "$PROBE_ERR" "$PROBE_OUT"; then
            echo "anonymous_free_tier_probe=AUTH_REJECTED"
          elif grep -Eiq '429|rate.?limit|quota' "$PROBE_ERR" "$PROBE_OUT"; then
            echo "anonymous_free_tier_probe=RATE_LIMITED"
          elif grep -Eiq 'upstream request failed|unavailable|bad gateway|gateway timeout|503|502|504' "$PROBE_ERR" "$PROBE_OUT"; then
            echo "anonymous_free_tier_probe=UPSTREAM_UNAVAILABLE"
          else
            echo "anonymous_free_tier_probe=UNKNOWN_NONZERO"
          fi

          rm -rf "$PROBE_HOME" "$PROBE_OUT" "$PROBE_ERR"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Initialize Storage Layout
        run: |
          CONTROL_DIR="$RUNNER_TEMP/harness-control/${LANE_ID}"
          PRIVATE_DIR="$RUNNER_TEMP/otonom-private/${LANE_ID}"
          TARGET_DIR="$RUNNER_TEMP/target-workspace/${LANE_ID}"
          mkdir -p "$CONTROL_DIR" "$PRIVATE_DIR" "$TARGET_DIR"
          {
            echo "CONTROL_DIR=$CONTROL_DIR"
            echo "PRIVATE_DIR=$PRIVATE_DIR"
            echo "TARGET_DIR=$TARGET_DIR"
          } >> "$GITHUB_ENV"

      - name: Prepare Lane Contract
        env:
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
        run: |
          pnpm tsx harness/runtime/prepare-lane.ts "$MANIFEST_PATH" "$LANE_ID" "$CONTROL_DIR" "$TARGET_DIR"

      - name: Bootstrap Target Workspace
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          pnpm tsx harness/runtime/bootstrap-cli.ts "$CONTROL_DIR/task.json" "$TARGET_DIR"

      - name: Run OpenCode Agent Headless
        run: |
          pnpm tsx harness/runtime/run-lane.ts "$CONTROL_DIR/task.json" "$CONTROL_DIR" "$PRIVATE_DIR" "$TARGET_DIR"

      - name: Execute Trusted Finalizer
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          pnpm tsx harness/finalizer/cli.ts "$CONTROL_DIR/task.json" "$CONTROL_DIR/result.json" "$TARGET_DIR" "$CONTROL_DIR/finalizer-report.json"

      - name: Emit Sanitized Lane Summary
        if: always()
        run: |
          pnpm tsx harness/runtime/emit-summary.ts "$CONTROL_DIR/finalizer-report.json" "$LANE_ID"

      - name: Verify Live Confidentiality Boundaries
        if: always()
        run: |
          pnpm tsx harness/policies/confidentiality-check.ts "$CONTROL_DIR" "$PRIVATE_DIR" "$TARGET_DIR"

  swarm-summary:
    name: Swarm Execution Summary
    needs: [validate-and-generate-matrix, run-agent]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Wave Completion
        env:
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_PARALLEL: ${{ needs.validate-and-generate-matrix.outputs.max_parallel }}
        run: |
          echo "============================================="
          echo "OTONOM Swarm Wave Execution Completed"
          echo "Wave: $MANIFEST_PATH"
          echo "Dry Run: $DRY_RUN"
          echo "Max Parallel: $MAX_PARALLEL"
          echo "============================================="
