name: OTONOM Swarm Runner

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path to wave/tasks manifest file (YAML or JSON)"
        required: true
        default: "config/lanes.example.yaml"
      source_ref:
        description: "Target repository Git commit SHA or ref"
        required: true
        default: "main"
      max_parallel:
        description: "Maximum concurrent agent jobs (1 to 20)"
        required: true
        default: "5"
      lane_filter:
        description: "Optional single lane ID to filter execution"
        required: false
        default: ""
      dry_run:
        description: "Dry-run mode: do not push branches or open PRs"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-and-generate-matrix:
    name: Generate Execution Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      max_parallel: ${{ steps.generate.outputs.max_parallel }}
    steps:
      - name: Checkout Harness Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Harness Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Skills and Configuration
        run: |
          pnpm tsx scripts/validate-skills.ts
          pnpm typecheck

      - name: Generate Matrix
        id: generate
        env:
          MAX_PARALLEL: ${{ github.event.inputs.max_parallel }}
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          LANE_FILTER: ${{ github.event.inputs.lane_filter }}
        run: |
          if [ "$MAX_PARALLEL" -gt 20 ]; then
            echo "ERROR: max_parallel cannot exceed 20 (requested $MAX_PARALLEL)" >&2
            exit 1
          fi

          MATRIX_JSON=$(pnpm tsx harness/matrix/generator.ts "$MANIFEST_PATH" "$MAX_PARALLEL" "$LANE_FILTER")
          {
            echo "matrix=$MATRIX_JSON"
            echo "max_parallel=$MAX_PARALLEL"
          } >> "$GITHUB_OUTPUT"

  run-agent:
    name: "Lane: ${{ matrix.lane }}"
    needs: validate-and-generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 35 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.validate-and-generate-matrix.outputs.max_parallel) }}
      matrix: ${{ fromJson(needs.validate-and-generate-matrix.outputs.matrix) }}
    env:
      LANE_ID: ${{ matrix.lane }}
      BASE_SHA: ${{ matrix.base_sha }}
      ROLE: ${{ matrix.role }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      CI: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_PAGER: "cat"
      PAGER: "cat"
      NO_COLOR: "1"
    steps:
      - name: Checkout Worker Harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Toolchain
        run: |
          pnpm install --frozen-lockfile
          # Pinned OpenCode installation from toolchain.lock.json
          npm install -g opencode-ai@1.18.32
          # Pinned Language Servers & CLI Tools
          npm install -g typescript-language-server@4.3.3 yaml-language-server@1.15.0 bash-language-server@5.4.3 vscode-langservers-extracted@4.10.0 @ast-grep/cli@0.45.3

      - name: Initialize Storage Layout
        run: |
          CONTROL_DIR="$RUNNER_TEMP/harness-control/${LANE_ID}"
          PRIVATE_DIR="$RUNNER_TEMP/otonom-private/${LANE_ID}"
          TARGET_DIR="$RUNNER_TEMP/target-workspace/${LANE_ID}"
          mkdir -p "$CONTROL_DIR" "$PRIVATE_DIR" "$TARGET_DIR"
          {
            echo "CONTROL_DIR=$CONTROL_DIR"
            echo "PRIVATE_DIR=$PRIVATE_DIR"
            echo "TARGET_DIR=$TARGET_DIR"
          } >> "$GITHUB_ENV"

      - name: Prepare Lane Contract
        env:
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
        run: |
          pnpm tsx harness/runtime/prepare-lane.ts "$MANIFEST_PATH" "$LANE_ID" "$CONTROL_DIR" "$TARGET_DIR"

      - name: Run OpenCode Agent Headless
        run: |
          pnpm tsx harness/runtime/run-lane.ts "$CONTROL_DIR/task.json" "$CONTROL_DIR" "$PRIVATE_DIR" "$TARGET_DIR"

      - name: Execute Trusted Finalizer
        run: |
          pnpm tsx harness/finalizer/cli.ts "$CONTROL_DIR/task.json" "$CONTROL_DIR/result.json" "$TARGET_DIR" "$CONTROL_DIR/finalizer-report.json"

      - name: Emit Sanitized Lane Summary
        if: always()
        run: |
          pnpm tsx harness/runtime/emit-summary.ts "$CONTROL_DIR/finalizer-report.json" "$LANE_ID"

  swarm-summary:
    name: Swarm Execution Summary
    needs: [validate-and-generate-matrix, run-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report Wave Completion
        env:
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_PARALLEL: ${{ needs.validate-and-generate-matrix.outputs.max_parallel }}
        run: |
          echo "============================================="
          echo "OTONOM Swarm Wave Execution Completed"
          echo "Wave: $MANIFEST_PATH"
          echo "Dry Run: $DRY_RUN"
          echo "Max Parallel: $MAX_PARALLEL"
          echo "============================================="
