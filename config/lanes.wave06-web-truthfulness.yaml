  - id: "web-layout-truthfulness"
    title: "Make the global web UI truthfulness notice accurate after live-surface wiring"
    role: "ui-builder"
    source_repository: "oaslananka/otonom"
    base_sha: "09af35c8b9d782df3f77ec8d55b16642a25349bd"
    objectives:
      - "Update only apps/web/src/app/layout.tsx."
      - "Replace the stale global warning that says all pages show illustrative sample data; several pages now consume live /api/v1/status and other pages deliberately show unavailable states."
      - "Use a concise truthful notice explaining that each surface shows live state only when backed by an exposed web-safe API contract, otherwise it explicitly renders unavailable/not-exposed."
      - "Remove or neutralize sidebar footer claims that imply a verified runtime/target configuration when the layout itself does not fetch live configuration (for example Runtime Neon Serverless and Target Multi-Account PAT)."
      - "Do not add new APIs, credentials, client fetches, dependencies, or operational claims."
      - "After run_verification and complete_lane succeed, stop immediately."
    allowed_write_paths:
      - "apps/web/src/app/layout.tsx"
    forbidden_write_paths:
      - "apps/control-plane/**"
      - "packages/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
    acceptance_criteria:
      - "The global notice no longer falsely claims all pages are sample-data previews."
      - "The notice accurately distinguishes live API-backed surfaces from explicit unavailable states."
      - "Unverified runtime/target configuration claims are removed or neutralized."
      - "No new operational claim, endpoint, secret, or dependency is introduced."
      - "Worker target-ci diff hygiene passes; dependency-backed checks are deferred to OTONOM PR CI."
    verification_profile: "target-ci"
    requires_changes: true
    timeout_minutes: 25
    attempt_timeout_minutes: 5
    risk_classification: "LOW"
