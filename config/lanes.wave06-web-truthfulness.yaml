tasks:
  - id: "web-repositories-truthful-surface"
    title: "Remove fabricated repository records from the web Repositories page"
    role: "ui-builder"
    source_repository: "oaslananka/otonom"
    base_sha: "09af35c8b9d782df3f77ec8d55b16642a25349bd"
    objectives:
      - "Update only apps/web/src/app/repositories/page.tsx."
      - "Remove fabricated repository identity, account, branch, source transport, autonomy level, protected paths, quality gates, webhook health, and timestamps."
      - "Render a truthful unavailable state explaining that live registered-repository listing and repository policy details are not exposed through the current public web-safe API contract."
      - "Do not invent a new endpoint, manager-auth flow, credential, sample repository, webhook state, quality-gate status, or action."
      - "Prefer a simple server component if client state is no longer needed."
      - "After run_verification and complete_lane succeed, stop immediately."
    allowed_write_paths:
      - "apps/web/src/app/repositories/page.tsx"
    forbidden_write_paths:
      - "apps/control-plane/**"
      - "packages/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
    acceptance_criteria:
      - "No fabricated repository or policy/health data remains."
      - "The page clearly states that live repository data is unavailable through the current public web-safe API."
      - "No credential, manager-auth workaround, new endpoint, or fake operational status is introduced."
      - "Worker target-ci diff hygiene passes; dependency-backed checks are deferred to OTONOM PR CI."
    verification_profile: "target-ci"
    requires_changes: true
    timeout_minutes: 25
    attempt_timeout_minutes: 5
    risk_classification: "LOW"

