tasks:
  - id: "web-frontier-truthful-surface"
    title: "Remove fabricated Frontier provider and decision state from web UI"
    role: "builder-core"
    source_repository: "oaslananka/otonom"
    base_sha: "8dc4406398bc64fca83b62446e14fa91ea8ea726"
    objectives:
      - "Modify only apps/web/src/app/frontier/page.tsx."
      - "Remove the hardcoded provider roster/status/auth/executor data and the fabricated recent Frontier decision/evidence record."
      - "Keep the page useful and truthful: the current control-plane exposes Frontier manager inspection endpoints such as /api/v1/frontier/hosts and /api/v1/frontier/jobs, but they require manager authentication and are not wired as a public browser-safe web contract. Do not invent credentials or call manager-only endpoints from the browser."
      - "Render a clear unavailable/not-wired state for live Frontier hosts/jobs/decisions instead of live-looking sample rows."
      - "Do not add backend endpoints, dependencies, mock data, timestamps, provider health claims, or mutation controls."
    allowed_write_paths:
      - "apps/web/src/app/frontier/page.tsx"
    forbidden_write_paths:
      - "apps/control-plane/**"
      - "packages/**"
      - ".github/**"
      - "pnpm-lock.yaml"
      - "package.json"
    acceptance_criteria:
      - "No hardcoded provider inventory or fabricated recent decision/evidence rows remain."
      - "No unauthenticated browser request is added to manager-only Frontier endpoints."
      - "The UI explicitly distinguishes implemented Frontier capabilities from unavailable live web data."
      - "pnpm test passes and git diff --check is clean."
    verification_profile: "lane"
    requires_changes: true
    timeout_minutes: 25
    attempt_timeout_minutes: 8
    risk_classification: "LOW"

  - id: "web-secrets-current-architecture"
    title: "Make Secrets page match current encrypted credential architecture"
    role: "builder-core"
    source_repository: "oaslananka/otonom"
    base_sha: "8dc4406398bc64fca83b62446e14fa91ea8ea726"
    objectives:
      - "Modify only apps/web/src/app/secrets/page.tsx."
      - "Remove the hardcoded SecretRef inventory, configured statuses, provider sources, redaction regexes, verification timestamps, and unwired Verify/Register buttons."
      - "Replace the superseded zero-persistence/SecretRef-only narrative with the current architecture: GitHub credentials may be persisted in PostgreSQL only as application-level AES-256-GCM envelopes via CryptoVault; plaintext is decrypted in memory for the call that needs it. Doppler/SecretRef-only is historical/superseded where it conflicts with the current ADR."
      - "Describe RedactionEngine only in source-backed scoped terms; do not claim universal 100% coverage or expose raw secret values."
      - "State that the public web surface currently has no safe secret inventory/health endpoint, so per-secret live status is unavailable rather than fabricated."
      - "Do not add backend endpoints, dependencies, secret reveal/copy controls, or credential mutation controls."
    allowed_write_paths:
      - "apps/web/src/app/secrets/page.tsx"
    forbidden_write_paths:
      - "apps/control-plane/**"
      - "packages/**"
      - ".github/**"
      - "pnpm-lock.yaml"
      - "package.json"
    acceptance_criteria:
      - "No fabricated per-secret rows/status/timestamps/provider bindings remain."
      - "No statement remains that the database stores only SecretRef pointers as the current credential architecture."
      - "No raw secret values, reveal controls, or unwired mutation buttons are introduced."
      - "The page clearly states that live per-secret inventory/status is unavailable in the public web contract."
      - "pnpm test passes and git diff --check is clean."
    verification_profile: "lane"
    requires_changes: true
    timeout_minutes: 25
    attempt_timeout_minutes: 8
    risk_classification: "LOW"

  - id: "web-dashboard-security-truthfulness"
    title: "Correct stale and absolute worker security claims on dashboard"
    role: "builder-core"
    source_repository: "oaslananka/otonom"
    base_sha: "8dc4406398bc64fca83b62446e14fa91ea8ea726"
    objectives:
      - "Modify only apps/web/src/app/page.tsx."
      - "Correct the stale fixed worker lease claim: current worker bootstrap and durable heartbeat paths use a 5-minute worker lease window; the worker session TTL is a separate 1-hour value refreshed on heartbeat."
      - "Replace the misleading 'Enforced by Gateway' framing because enforcement is distributed across workflow permissions, MCP tool policy, worker protocol patch validation, trusted integration, and control-plane runtime."
      - "Keep only source-backed scoped claims: worker workflow uses contents: read and id-token: write with checkout credentials not persisted; git_push/git_force_push MCP tools are globally blocked; patch boundaries are validated before trusted integration; RedactionEngine is wired into worker/control-plane paths."
      - "Remove absolute language such as '100%' coverage or claims that every git push attempt necessarily fails at one specific credential layer."
      - "Do not change live /api/v1/status metrics behavior or add backend/API work."
    allowed_write_paths:
      - "apps/web/src/app/page.tsx"
    forbidden_write_paths:
      - "apps/control-plane/**"
      - "packages/**"
      - ".github/**"
      - "pnpm-lock.yaml"
      - "package.json"
    acceptance_criteria:
      - "The dashboard no longer says worker leases expire in 15 minutes."
      - "Security posture wording matches current implementation without unsupported absolutes or single-gateway attribution."
      - "Existing live status metrics and degraded-state behavior are unchanged."
      - "pnpm test passes and git diff --check is clean."
    verification_profile: "lane"
    requires_changes: true
    timeout_minutes: 25
    attempt_timeout_minutes: 8
    risk_classification: "LOW"
