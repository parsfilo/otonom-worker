tasks:
  - id: "web-projects-truthful-surface"
    title: "Remove fabricated Project Brain records from the web Projects page"
    role: "ui-builder"
    source_repository: "oaslananka/otonom"
    base_sha: "e56ad438bf319556174d683a61a0ed5ce3e96298"
    objectives:
      - "Update only apps/web/src/app/projects/page.tsx."
      - "Remove the fabricated project identity, revision, branch, facts/decisions/directives counts, and timestamps."
      - "Render a truthful empty/unavailable state explaining that live project/Project Brain listing is not exposed by the current public web-safe API contract."
      - "Do not invent a new API, manager-auth flow, credential, demo project, sample count, action button, or client-side secret."
      - "Prefer a simple server component if client state is no longer needed."
      - "After run_verification and complete_lane succeed, stop immediately."
    allowed_write_paths:
      - "apps/web/src/app/projects/page.tsx"
    forbidden_write_paths:
      - "apps/control-plane/**"
      - "packages/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
    acceptance_criteria:
      - "No fabricated project row or fake Project Brain counts remain."
      - "The page states truthfully that live project data is unavailable through the current public web-safe API."
      - "No manager secret/auth workaround or new endpoint is introduced."
      - "Worker target-ci diff hygiene passes; dependency-backed checks are deferred to OTONOM PR CI."
    verification_profile: "target-ci"
    requires_changes: true
    timeout_minutes: 25
    attempt_timeout_minutes: 5
    risk_classification: "LOW"

  - id: "web-tasks-truthful-surface"
