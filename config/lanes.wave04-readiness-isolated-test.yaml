tasks:
  - id: "control-plane-real-readiness"
    title: "Make /ready a real database readiness probe with isolated readiness tests"
    role: "builder-core"
    source_repository: "oaslananka/otonom"
    base_sha: "c7c096af753f8cd2dd5f58b434e140e16484f803"
    objectives:
      - "Replace the unconditional GET /ready success with a real lightweight PostgreSQL connectivity check against the same DbClient used by the app."
      - "Keep GET /health a liveness endpoint that does not depend on database availability."
      - "Wire the existing app DbClient into health route registration with the smallest change; do not create a new database pool."
      - "Return HTTP 200 with ready:true on successful DB check and HTTP 503 with ready:false on DB failure; do not expose SQL, credentials, connection strings, or raw database errors."
      - "Add readiness regression coverage in a new dedicated apps/control-plane/src/routes/health.test.ts file. Do NOT edit apps/control-plane/src/server.test.ts because that existing baseline file intentionally contains secret-like redaction fixtures that the trusted finalizer must continue to reject in changed-file content scans."
      - "Do not introduce any token-like, JWT-like, PAT-like, credential-like, or high-entropy secret fixture strings in changed files."
    allowed_write_paths:
      - "apps/control-plane/src/routes/health.ts"
      - "apps/control-plane/src/routes/health.test.ts"
      - "apps/control-plane/src/server.ts"
    forbidden_write_paths:
      - "apps/control-plane/src/server.test.ts"
      - "packages/database/**"
      - "packages/orchestrator/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
    acceptance_criteria:
      - "/health remains HTTP 200 and does not perform a DB readiness query."
      - "/ready proves DB connectivity using the app-shared DbClient and returns 200 ready:true when healthy."
      - "/ready returns 503 ready:false with a generic response when the DB readiness query fails."
      - "Dedicated health route tests cover healthy and failed readiness without changing server.test.ts."
      - "No new DB pool, dependency, secret exposure, raw error leakage, or secret-like test fixture is introduced."
      - "Worker target-ci diff hygiene passes; dependency-backed lint/typecheck/test/build are verified by the target repository PR CI after finalization."
      - "After run_verification and complete_lane succeed, stop immediately."
    verification_profile: "target-ci"
    requires_changes: true
    timeout_minutes: 25
    attempt_timeout_minutes: 5
    risk_classification: "LOW"
